# Dreamer — system constants.
#
# Copy to `config.yaml` and edit. `config.yaml` is gitignored, so your real
# paths and tuning never end up in a commit.
#
# Every constant the constitution (CLAUDE.md) names must exist here. The
# constitution is forbidden from hardcoding a value this file defines — that
# is what keeps the rules readable and the numbers tunable.

paths:
  # Relative paths resolve against the repo root, so a fresh clone just works.
  # Absolute paths are honoured unchanged — use one for `vault` if you want
  # your notes in a separate private repo or on a different disk.
  root:            .
  vault:           vault
  inbox:           vault/inbox
  resurfacings:    vault/inbox/resurfacings
  sources:         vault/sources/transcripts
  loops:           vault/loops
  goals:           vault/goals
  frontier:        vault/frontier
  conclusions:     vault/conclusions
  concepts:        vault/concepts
  archive:         vault/archive
  digests:         vault/digests
  meta:            vault/.vault-meta
  logs:            logs

# Where your raw material lives. Both are optional:
#   - without `claude_export`, ingest transcripts yourself into vault/inbox
#   - without `wisdom_sources`, the `wisdom` research route has nothing to
#     read and loops routed there escalate to web (constitution rule 5a)
corpora:
  # Unpacked claude.ai data export, or any directory of conversations.json.
  claude_export:   /path/to/claude-export
  # Claude Code sessions (bin/ingest-cc.sh). One file per conversation at
  # <project>/<session-id>.jsonl. Files nested deeper than that are spawned
  # subagent transcripts and are excluded by shape — see cc_ingest below.
  claude_code_sessions: ~/.claude/projects
  # Claude desktop app local-agent sessions (scripts/convert_desktop_sessions.py,
  # same ingest-cc cron line). One transcript per <account>/<org>/local_<id>/audit.jsonl.
  claude_desktop_sessions: ~/.config/Claude/local-agent-mode-sessions
  # Directories of books, papers, lecture transcripts — your reference
  # library. Any mix of .txt / .md / .pdf / .epub; see bin/verify.sh.
  wisdom_sources:
    - /path/to/your/library
  # Where extracted plain text is written for indexing. Gitignored.
  wisdom_build:    wisdom_md

# --- state machine --------------------------------------------------------
decay:
  # Null until you are ready for loops to start ageing out. Decay is inert
  # while this is null, which is the correct setting for a first run and for
  # the whole of any backfill.
  #
  # Decay is measured against max(last_seen, go_live_date), never last_seen
  # alone — otherwise a backfilled loop whose last occurrence is months old
  # would archive on day one and destroy the value of the backfill.
  go_live_date:    null
  decay_weeks:     8
  # paused / decision-only loops decay at this multiple of decay_weeks
  terminal_multiplier: 2

# --- matching -------------------------------------------------------------
matching:
  # How many distinct conversations a loop needs before it is eligible for
  # research. Do NOT guess this: run `python3 scripts/calibrate.py all` and
  # read the recurrence histogram off your own corpus. Too low and the weekly
  # run drowns in one-offs; too high and it starves.
  recurrence_min:  2
  # How many catalog candidates Stage A considers before opening any page.
  stage_a_top_k:   5
  # Recency-weighted recurrence: weight = 0.5 ** (age_days / half_life_days)
  recency_half_life_days: 60
  # An unconfirmed merge proposal is re-proposed once, then cools down for
  # this long rather than nagging forever.
  merge_proposal_expiry_weeks: 4
  # Paid judge calls per merge refresh. Each pair is judged once and the
  # verdict is cached, so this caps how fast the backlog drains — not how much
  # work is re-bought every run.
  max_judged_per_run: 40
  precision_floor: 0.70
  precision_window: 30

# --- extraction -----------------------------------------------------------
extraction:
  # Transcripts per LLM call. Smaller = more resumable, more overhead.
  batch_size:      15
  # Size of the pilot slice used for calibration before a full backfill.
  slice_size:      100

# --- goals ----------------------------------------------------------------
# Goals are authored by the owner and tracked by the assessor leg
# (bin/nightly-assess.sh); Dreamer never invents one.
goals:
  max_active:                4    # enforced deterministically at commit
  silence_ping_days:         10   # days without a mention before a question
  movement_stale_days:       21   # days without movement before drift is flagged
  drift_recurrence_min:      3    # mentions-without-movement before a drift question
  max_open_questions:        2    # back-pressure on the open-questions queue
  back_off_days:             14   # a deferred question is not re-asked before this
  silence_escalation_weeks:  3    # silence escalates after this many weeks
  # Transcripts the assessor reads per run, oldest unassessed first. The rest
  # drain on later nights; a normal night ingests fewer than this.
  assess_batch_size:         5

# --- tagging --------------------------------------------------------------
tagging:
  # One-time backfill drain batch size (bin/tag-backfill.sh); safe to delete
  # this block (and the script) once the drain reports complete.
  backfill_per_run: 40

# --- Claude Code session ingestion ----------------------------------------
# bin/ingest-cc.sh. Defaults also live in scripts/convert_cc_sessions.py
# DEFAULTS, so the job works before this block exists; anything set here wins.
cc_ingest:
  # Floors on what counts as a conversation rather than a one-shot command.
  min_human_turns:      3
  min_human_chars:      1500
  # Never ingest a session still being written — half a conversation would be
  # captured and never revisited.
  min_quiet_hours:      6
  # Fenced blocks longer than this collapse to a line count. Short ones are
  # usually the thing being discussed rather than a paste.
  max_code_lines:       8
  # Summariser input budget. Owner turns are kept whole and assistant context
  # is spent first; if owner turns alone overflow, both ends are kept and the
  # elision is stated. The rendered prompt is held under the 128 KB Linux
  # single-argument limit that run_claude passes it through.
  max_summarizer_chars: 240000
  # Sessions summarised per run — one paid summariser call each, so this
  # bounds a run's spend and a backlog drains over several runs.
  max_sessions_per_run: 10
  # entrypoint is the discriminator that matters: sdk-cli sessions are
  # headless cron runs and spawned subagents — including Dreamer's own nightly
  # and weekly jobs. Ingesting those would feed Dreamer its own output as
  # though it were the owner's. Never ingested.
  entrypoints:          [cli]
  # Escape hatch, empty by design: the entrypoint filter already excludes
  # Dreamer's own automation.
  exclude_projects:     []

# Claude desktop app session ingestion. The triage floors and the quiet
# window are inherited from cc_ingest above; set one here to diverge.
desktop_ingest:
  # Own ledger, so the claude-code arrival axis keeps meaning Claude Code.
  ledger:               desktop-ingested.json
  # Shown as `project:` on the page; the app has no project dimension.
  project_label:        desktop
  max_sessions_per_run: 10

# --- budget ---------------------------------------------------------------
budget:
  max_turns_nightly:  60
  max_turns_weekly:   150
  max_turns_backfill: 80
  # The summariser reads one inlined session and returns JSON. It needs no
  # tools and should not be taking turns.
  max_turns_cc_ingest: 10
  # The thread fold reads one inlined transcript plus the current thread and
  # returns JSON. It runs RESTRICTED (run_claude 4th arg): no tools at all.
  max_turns_thread_fold: 8
  # The assessor may read the goal catalog and transcripts; its fold step
  # (one attachment into one goal's assessment) runs RESTRICTED, no tools.
  max_turns_assess: 30
  max_turns_assess_fold: 8
  # The gated research call (run_claude gated): WebSearch only, behind the
  # egress hook. Each approved query costs about one turn.
  max_turns_frontier_research: 8
  # The sealed frontier calls (restricted mode clamps turns at 4). Each reads
  # an inlined prompt and answers with one JSON object.
  max_turns_frontier_extract: 4
  max_turns_frontier_match: 4
  max_turns_frontier_premortem: 4
  max_turns_frontier_check: 4
  max_turns_frontier_consequence: 4
  max_turns_frontier_queries: 4
  max_turns_frontier_claims: 4
  max_turns_frontier_compose: 4
  max_turns_frontier_lesson_check: 4
  # Model for headless job runs. The jobs are high-volume and structured, so
  # a cheaper model per call means more calls before any usage window closes.
  model: sonnet

  # Post-run cost gate. `null` = unlimited (the default).
  #
  # Cost is recorded and reported every run regardless; only the gate is off.
  # Under a subscription the reported figure is API-equivalent notional
  # pricing, not money spent, and the real limit is the rolling usage window —
  # which the job harness already handles by treating a non-zero exit as a
  # clean, resumable deferral. Set a float to restore the gate; that becomes
  # meaningful if you run the jobs against a paid API key.
  cost_ceiling_per_run: null

freshness:
  # Warn in the digest when no new transcript has arrived in this long; also
  # the window for the claude.ai export source axis.
  stale_inbox_days: 10
  # No Claude Code session ingested for this many days marks that source stale.
  cc_sessions_quiet_days: 3
  # source.claude-ai: how old the last ok daily sync may be (one missed day plus slack).
  claude_ai_sync_max_age_hours: 36
  # source.claude-ai goes stale this many days before the claude.ai login expires.
  claude_ai_login_warn_days: 3
  # Nightly jobs: one missed night goes stale.
  job_max_age_hours: 28
  # Weekly jobs (decay-archive).
  weekly_job_max_age_days: 8
  # A transcript waiting this many days for extraction is stale.
  extract_lag_days: 2
  # Same for goal assessment (only judged while a goal is active).
  assess_lag_days: 2
  frontier_map_lag_days: 3    # converge.frontier-map: a transcript waiting this long to be mapped (one batch a night; a long backfill reads stale by design)
  frontier_premortem_slack_days: 3   # converge.premortem: an active goal is stale this long PAST frontier.premortem_every_days without a pre-mortem
  # Last successful Postgres publish older than this reads stale (opt-in).
  publish_max_age_hours: 3
  # Postgres publisher: connect timeout, per-statement and lock-wait cap, and a
  # hard cap on one whole publish (the process ends at the deadline).
  publish_timeout_seconds: 5
  publish_statement_timeout_seconds: 10
  publish_deadline_seconds: 30
  # v_status.laptop_reachable is false once no snapshot arrived for this long.
  reachable_max_age_hours: 2
  # Runs kept in heartbeats.json.
  run_history_keep: 200

# --- board ----------------------------------------------------------------
# Whether the board publisher runs at all is DREAMER_PUBLISH_BOARD=1 in
# postgres.env, never this file.
board:
  # Hard cap on one board publish; the process ends after this many seconds.
  publish_deadline_seconds: 30
  # A conclusion section longer than this is truncated and counted.
  section_max_chars: 20000
  # The MCP server publishes right after a status change.
  publish_on_owner_write: true

# --- research -------------------------------------------------------------
research:
  # Loops researched per weekly run.
  weekly_loop_count: 3
  # Hard cap on outbound fetches per loop (constitution rule 12).
  max_fetches_per_loop: 45
  # A concluded loop that resurfaces is SERVED its existing conclusion, not
  # re-researched, unless something is genuinely new (rule 14). This is a hard
  # cooldown regardless of what the selection judge decides — without it, one
  # loop can generate a chain of superseding conclusions in a couple of days.
  min_days_between_reresearch: 21
  # Only externally-factual (web/mixed) conclusions rot on age alone;
  # principle-level ones do not.
  web_conclusion_stale_days: 90

# --- thread (living-thread fold queue; see CLAUDE.md rule 15) -------------
thread:
  # Nightly fold cap: bounds a run's fold spend; entries over the cap stay
  # queued and drain on the next run.
  fold_per_run: 20
  # A fold that keeps failing is a defect, not work to re-buy every night:
  # after this many attempts the entry is moved to
  # vault/.vault-meta/fold-quarantine.json with one degraded event.
  fold_max_attempts: 5
  # fold-queue-current (healthcheck, degraded): queue depth above this means
  # folds are enqueued faster than the drain retires them.
  fold_queue_max: 80
  # ...and any entry older than this many days means the drain has stopped
  # retiring it. Entries without an enqueued_at stamp count as fresh.
  fold_queue_max_age_days: 7
  # One-time thread backfill (bin/thread-backfill.sh) drain cap — counted in
  # FOLD PASSES, not loops. This key (and the script) are safe to delete once
  # the backfill reports drain complete.
  backfill_per_run: 60

# --- health (mechanical self-checks; see CLAUDE.md rule 15) ---------------
health:
  checked_max_age_hours: 16   # longest quiet gap in the cron schedule + slack
  detail_max_ids: 8           # ids a frontier assertion names in its one-line detail; the rest are counted
  embed_pending_max: 50       # docs awaiting embedding before retrieval counts degraded
  index_stale_hours: 30       # nightly reindex cadence + slack
  untagged_window_days: 14    # window for the vocabulary-applied check
  cost_max_per_run: 50.00     # above any legitimate single run
  cost_window_days: 7         # only recent records can trip the cost check
  gates: []                   # standing owner reminders, e.g.
                              # - {flag: my_gate, text: "acceptance gate still open"}
                              # closed by vault/.vault-meta/gate-state.json {"my_gate": true}

# --- knowledge frontier (map of what you know + the lesson stream) ---------
frontier:
  # How long a frontier CLI waits for wiki.lock before giving up (seconds).
  vault_lock_wait_seconds: 20
  # Frontier publisher (scripts/frontier_publish.py): how long it waits for wiki.lock
  # before skipping this hour silently, and the hard cap on one publish (process ends).
  publish_lock_wait_seconds: 5
  publish_deadline_seconds: 30
  # Minimum length of the cause recorded on an undo (tombstone + move).
  cause_min_chars: 8
  # An owner turn longer than this keeps its head and tail (half each) and
  # marks the cut: long turns are mostly pasted material.
  owner_turn_max_chars: 3000
  # Paragraphs kept on each side of a qmd hit's matched line (owner_text.passages).
  passage_window_paragraphs: 1
  # Warm qmd client (scripts/qmd_client.py): per-call timeout, including the
  # first call's model load. Past it the result is "degraded", never "empty".
  qmd_timeout_seconds: 20
  # Hits requested per qmd query when the caller does not say.
  qmd_default_limit: 10
  # Map builder (scripts/frontier_map.py, bin/frontier-backfill.sh).
  # Owner text per extraction batch.
  map_batch_chars: 80000
  # Hard cap on any frontier prompt; retrieved neighbours are dropped lowest-ranked first.
  prompt_max_chars: 120000
  # Neighbours retrieved from the `frontier` collection per concept (recall-tuned).
  match_top_k: 5
  # Concepts judged per match call; later chunks also see the earlier concepts of the batch.
  match_chunk_concepts: 40
  # Concepts kept per transcript (learnable concepts, not every topic).
  max_items_per_transcript: 8
  # A malformed reply is retried this many times before the chat is deferred(parse).
  parse_retries: 1
  # Deferred(parse) runs per chat before it is skipped with a degraded event.
  max_parse_attempts: 3
  # Loop statuses that seed a known-unknown item (unresolved ones; not archived/resolved).
  seed_loop_statuses: [open, researching, paused, decision-only]
  # File names under paths.meta: the per-transcript map ledger, and the lock that
  # keeps the nightly job and the backfill from overlapping (held for the whole run;
  # wiki.lock is taken only around each apply-and-commit step).
  map_ledger_file: frontier-map-ledger.json
  lock_file: frontier.lock
  # The "show": whatever app consumes lessons (scripts/frontier_sync.py; contract in
  # docs/frontier-schema.md). OFF while show_url is empty: no token is read and no
  # request is made. Dreamer starts every exchange: lessons and the known list go out,
  # status and taps come back. The URL must be https (loopback http is also accepted;
  # any other http needs allow_insecure_http). The token lives in show_env_path
  # (KEY=VALUE, key DREAMER_LESSON_TOKEN); env DREAMER_SHOW_ENV overrides the path.
  show_url: ""
  allow_insecure_http: false
  show_timeout_seconds: 10
  show_env_path: ~/.config/dreamer/show.env
  # Sync cursor, conflicts and known-list hash, under paths.meta.
  sync_state_file: frontier-sync.json
  # Known-known titles sent to the show (newest evidence first).
  known_push_max: 200
  # Release ceiling: at most this many NEW lessons released in any trailing
  # ceiling_window_days. Follow-ups are exempt; a failed lesson frees its slot.
  weekly_ceiling: 3
  ceiling_window_days: 7
  # A released lesson not aired within this many days becomes failed.
  air_deadline_days: 7
  # MCP tools what_do_i_know / get_frontier: items returned per call, newest evidence first;
  # more are flagged `more: true`, not sent.
  mcp_max_items: 20
  # Follow-up lessons one item may hold (rejected and dropped ones do not count).
  max_follow_ups_per_item: 2
  # Pre-mortem (scripts/frontier_gaps.py). A goal is due when its last
  # pre-mortem is older than this many days (or its plan changed).
  premortem_every_days: 7
  # Map items (title + quadrant) retrieved with the goal text for the pre-mortem prompt.
  premortem_map_items: 40
  # Failure causes accepted from one pre-mortem reply (ranked, most likely first).
  premortem_max_causes: 6
  # Pieces of knowledge accepted per failure cause.
  max_candidates_per_cause: 3
  # Never-discussed check: hits requested from EACH collection below per candidate
  # (recall-tuned; the judge, not retrieval, decides).
  check_top_k: 8
  # Plus a keyword search on the title alone per collection, appended after the hits above.
  check_title_lex_k: 5
  # Plus the owner's own phrases, appended last: the title split at punctuation and
  # these words, each part with at least check_phrase_min_words content words (as
  # check_owner_* defines them) searched in every chat's owner turns. The keyword
  # search ANDs a whole title, so a chat where the owner said one half of a compound
  # title in passing would otherwise never be shown. The chats with the most phrases,
  # newest first, are kept.
  check_phrase_split_words: [and, or, versus, vs, "&"]
  check_phrase_min_words: 2
  check_phrase_max_chats: 5
  check_collections: [frontier, transcripts, vault, conclusions]
  # Characters of passages shown to the check judge per hit file.
  check_passage_chars: 1500
  # The owner's own paragraphs added per hit CHAT (owner_text.owner_passages): qmd's
  # best line usually sits in a long assistant reply, which alone can only show exposure.
  # A separate budget, so assistant passages never crowd the owner's words out.
  check_owner_chars: 1500
  # Owner paragraphs picked by shared words with the candidate (beyond the question
  # each assistant hit answered), and the most characters shown of any one paragraph.
  check_owner_paragraphs: 3
  check_owner_paragraph_chars: 600
  # Word match: a shared title stem scores check_owner_title_weight, a shared summary
  # stem 1; a paragraph needs check_owner_min_score (so one title word, or two summary words).
  check_owner_min_score: 2
  check_owner_title_weight: 2
  # A stem is a word's first check_owner_stem_chars letters; shorter words and
  # these function words never count.
  check_owner_stem_chars: 5
  check_owner_min_word_chars: 3
  check_owner_stopwords: [about, above, after, again, against, all, also, and, any, are, because, been,
    before, being, below, between, both, but, can, could, did, does, doing, don't, down, during, each,
    even, every, few, for, from, further, get, gets, getting, going, had, has, have, having, her, here,
    him, his, how, i'm, into, it's, its, just, know, like, lot, make, makes, many, may, maybe, might,
    more, most, much, must, not, now, off, once, one, only, other, our, out, over, own, really, same,
    she, should, some, something, still, such, than, that, the, their, them, then, there, these, they,
    thing, things, think, this, those, through, too, under, until, use, used, using, very, want, was,
    way, well, were, what, when, where, which, while, who, whom, why, will, with, within, without,
    would, yes, yet, you, your]
  # Records live in paths.frontier/<this>/<goal>/<date>.md.
  premortems_dir: premortems
  # Web egress gate (scripts/egress_check.py, scripts/egress_hook.py).
  egress:
    # Word list for the capitalised-token check. A missing file blocks every
    # capitalised token (fail closed).
    dictionary_path: /usr/share/dict/words
    # Owner and third-party names, one per line, matched case-insensitively.
    # A missing, unreadable or empty file blocks every query (fail closed).
    blocked_names_path: ~/.config/dreamer/egress-blocked.txt
    # Capitalised terms that name no person or private entity. Add a term only
    # when it is a product, place or field name.
    allowed_proper_nouns: []
    # A run of this many words copied from the goal page or the item's
    # evidence blocks the query.
    phrase_run_words: 4
    # A 4-digit run counts as a year (allowed) only inside this range.
    year_min: 1900
    year_max: 2100
    # Every query, allowed or denied, one JSON line each (relative paths resolve against the repo root).
    log_path: logs/frontier-egress.jsonl
    # A DNS lookup for a fetch gives up after this many seconds (fail closed).
    dns_timeout_seconds: 5
  # Lessons (scripts/frontier_lessons.py, scripts/verify_passages.py).
  # Lessons researched per night, follow-ups first (the research budget; the release ceiling is weekly_ceiling).
  research_per_night: 3
  # Generic questions the queries call may write per lesson.
  max_queries_per_lesson: 3
  # Web pages code will fetch per lesson, and so the most URLs the research call may return.
  # Refused pages (PDF, 403) count against the cap, and the two-domain rule needs two that load.
  max_fetches_per_lesson: 6
  # A web source's label (page title, else search title, else domain) is cut to this many characters.
  source_title_max_chars: 160
  # A fetch (all hops together) stops after this many seconds, and refuses a body past this many bytes.
  fetch_timeout_seconds: 15
  fetch_max_bytes: 1500000
  # Bytes read per chunk while counting a body against fetch_max_bytes.
  fetch_chunk_bytes: 16384
  # Redirect hops followed (each hop is re-checked like the first URL).
  fetch_max_redirects: 3
  fetch_user_agent: "Mozilla/5.0 (compatible; DreamerResearch/1.0)"
  # Hosts where each subdomain is a different owner: the registrable domain keeps the subdomain.
  shared_host_suffixes: [github.io, gitlab.io, blogspot.com, substack.com, medium.com, wordpress.com, netlify.app, vercel.app, pages.dev, web.app]
  # A quoted passage counts when this many normalised tokens appear as one run in its source.
  passage_min_run_tokens: 8
  # The verified span kept for a passage is cut to this many characters.
  passage_max_chars: 400
  # Text that looks like an instruction to a model (rule 10). A source span matching one is
  # flagged and unusable; a body matching one is rejected by code.
  instruction_patterns:
    - '\b(ignore|disregard|forget|override)\b[^.\n]{0,40}\b(previous|prior|above|earlier|all|any|your)\b[^.\n]{0,30}\b(instructions?|prompts?|rules?|directions?)\b'
    - '\b(system|developer) (prompt|message|instructions?)\b'
    - '\byou (must|should) now\b'
    - '\b(do not|don.t) (tell|reveal|mention)\b[^.\n]{0,30}\b(user|owner|reader|anyone)\b'
    - '\b(call|invoke|run|execute|use) the (tool|function|command|shell)\b'
    - '\b(fetch|visit|open|navigate to|send (it|this|the \w+) to)\b[^.\n]{0,20}https?://'
    - '</?\s*(system|assistant|tool|function_calls|invoke)\b'
    - '\bas an ai (language )?model\b'
  # Library passages: hits per lesson, and lines read around each hit with `qmd get`.
  lesson_wisdom_hits: 3
  lesson_wisdom_window_lines: 60
  # ...cut to this many characters around the match: a library transcript can hold
  # a whole chapter on one line. The match is found by the first this-many characters
  # of qmd's snippet (verbatim document text; the snippet itself is never source text).
  lesson_wisdom_window_chars: 6000
  lesson_wisdom_anchor_chars: 40
  # Owner words (earlier turns) a lesson about an unknown known may cite.
  lesson_owner_sources: 3
  # Characters of each source shown to the claims call (verification reads the whole source).
  lesson_source_chars: 12000
  # Claims accepted from one claims reply.
  lesson_max_claims: 12
  # Rewrites a rejected lesson gets, each judged afresh; security rejections are never rewritten.
  lesson_max_revisions: 2
  # The research ledger beside the map ledger (paths.meta).
  research_ledger_file: frontier-research-ledger.json
  # A finished lesson that finds wiki.lock busy waits here (a directory under paths.meta,
  # gitignored) and is applied by the next run without a model or web call.
  pending_dir: frontier-pending
  # Where the approved queries for the gated research call are written (paths.logs).
  research_approved_file: .egress-approved-frontier-research.txt

# Locks shared by the cron jobs (bin/_common.sh).
locks:
  # A job that finds wiki.lock held waits this long (seconds) before skipping its run:
  # a frontier apply holds it for seconds, so the job waits instead of losing the night.
  cron_wait_seconds: 120

# --- qmd (search index) ---------------------------------------------------
qmd:
  collections: [vault, transcripts, conclusions, wisdom, frontier]

# --- MCP ------------------------------------------------------------------
mcp:
  transport: stdio              # no TCP listener, so no token to manage
  note_max_chars: 500
  max_resurfacings_per_run: 50
  # Owner-write tools (commit_goal, set_status, ...) must carry a verbatim
  # owner quote of at least this many characters.
  owner_write_quote_min_chars: 8
  # A write whose quote is still absent from ingested Human turns after this
  # many days is quarantined and raised as an owner question.
  owner_write_verify_lag_days: 3

# --- pinned versions ------------------------------------------------------
pins:
  qmd_version:     "2.5.3"
  # skills/autoresearch is vendored from this commit. See its ATTRIBUTION.md.
  claude_obsidian_commit: "1c1bc49c03a685ee8f5d09c99efe52b42d6673f5"
  claude_obsidian_scope: "skills/autoresearch only (vendored, MIT)"

# --- solution spine -------------------------------------------------------
solving:
  # false turns the spine off: no spine request in the research prompt, previous page layout.
  enabled: true
  min_options: 2        # options required besides "Leave it"

# --- claude.ai daily sync -------------------------------------------------
# Daily claude.ai -> Dreamer sync (docs/claude-ai-sync.md). Read by the native
# host (scripts/claude_ai_host.py), the Chrome extension (through the host's
# status reply), bin/claude-ai-host, bin/sync-claude-ai.sh and
# bin/install-sync-extension.sh. Empty extension_id means the sync is not set
# up: its freshness axes read info/disabled.
claude_ai_sync:
  python: /usr/bin/python3        # bin/claude-ai-host: Chrome starts the host with no shell environment
  host_name: com.dreamer.claude_ai_sync  # must match HOST in extension/dreamer-sync/background.js
  extension_id: ""                # the ID Chrome shows for the unpacked extension on chrome://extensions
  due_hours: 20                   # a run is due when last_ok is older than this
  retry_after_failure_hours: 3    # after a failed attempt, wait this long before the hourly tick retries
  quiet_hours: 6                  # skip chats updated more recently; a later run takes them
  max_per_run: 40                 # chats fetched per run; the rest wait (state "pending")
  spacing_seconds: 3              # minimum gap between chat requests
  page_size: 50                   # list page size
  max_pages: 200                  # safety bound on list paging
  max_retries: 4                  # for 429 and 5xx, per request
  backoff_base_seconds: 5
  backoff_max_seconds: 120
  lock_wait_seconds: 2700         # bin/sync-claude-ai.sh waits this long for wiki.lock (an extraction in progress)
